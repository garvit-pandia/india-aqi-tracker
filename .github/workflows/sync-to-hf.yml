name: Sync to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Push only app files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir hf-deploy
          cp app.py requirements.txt city_day.csv hf-deploy/
          cp README.md hf-deploy/ 2>/dev/null || true
          cd hf-deploy
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy: ${{ github.sha }}"
          git branch -m master main
          git push -f https://garvitpandia28:$HF_TOKEN@huggingface.co/spaces/garvitpandia28/india-aqi-tracker-live main
