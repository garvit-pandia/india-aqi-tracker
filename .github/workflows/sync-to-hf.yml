name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push -f https://garvitpandia28:$HF_TOKEN@huggingface.co/spaces/garvitpandia28/india-aqi-tracker-live main
```

> Note: `lfs: true` is important because your repo has GIF files tracked by Git LFS.

---

**Step 5:** Scroll down > **Commit new file** > commit directly to `main`

---

**Step 6:** Go to the **Actions** tab on your GitHub repo. You will see a workflow run already triggered. Click it to watch live logs.

---

**Step 7:** After it turns green, visit:
`https://huggingface.co/spaces/garvitpandia28/india-aqi-tracker-live`

It should start rebuilding with your latest code.

---

